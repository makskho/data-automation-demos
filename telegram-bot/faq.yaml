# Дерево FAQ. Редактируйте текст и кнопки, структуру можно менять как угодно.
#
# welcome  - текст при /start
# items    - кнопки главного меню
#   id       - уникальный код (a-z, 0-9, _ и -, до 40 символов), в тексте кнопки не виден
#   title    - надпись на кнопке (до 60 символов)
#   text     - ответ, который увидит клиент (до 4000 символов); обязателен, если нет children
#   children - вложенные кнопки, любая глубина
#
# После правки перезапустите бота. Если в файле ошибка, бот не запустится и скажет, где именно.

welcome: |
  Здравствуйте! Это бот студии «Пример». Выберите раздел или оставьте заявку - мы перезвоним.

items:
  - id: services
    title: "🛠 Услуги"
    text: "Что мы делаем. Выберите направление:"
    children:
      - id: services-sites
        title: "Сайты"
        text: "Лендинги и сайты-визитки под ключ: дизайн, вёрстка, подключение формы заявок."
      - id: services-bots
        title: "Telegram-боты"
        text: "Боты с меню, формами заявок и выгрузкой в Excel. Срок - от 3 дней."
        children:
          - id: services-bots-faq
            title: "Бот с FAQ"
            text: "Меню с вопросами и ответами, которое клиент листает сам. Правится текстовым файлом."
          - id: services-bots-leads
            title: "Бот для заявок"
            text: "Собирает имя, телефон и описание задачи и сразу присылает вам уведомление."
  - id: prices
    title: "💰 Цены и сроки"
    text: |
      Лендинг - от 15 000 руб., 5-7 дней.
      Telegram-бот - от 8 000 руб., 3-5 дней.
      Точную цену назовём после короткого описания задачи.
  - id: payment
    title: "💳 Как проходит оплата"
    text: |
      Предоплата 50%, остальное - после того как вы приняли работу.
      Работаем по договору и выдаём акт.
  - id: contacts
    title: "📍 Контакты"
    text: "Пн-пт, 10:00-19:00. Ответ на заявку - в течение рабочего дня."
